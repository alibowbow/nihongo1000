<title>千日文 — 일본어 천일문</title>
<meta name="description" content="핵심 문형 50과 × 1000문장으로 익히는 일본어. 천일문 방식의 문장 암기 학습 웹앱.">
<script>
/* 첫 페인트 전에 테마·코스 색·글자 크기를 적용해 깜빡임(FOUC)을 막는다 */
(function () {
  try {
    var st = JSON.parse(localStorage.getItem('nihongo1000.v1') || '{}');
    var s = st.settings || {};
    var t = s.theme || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    var h = document.documentElement;
    h.dataset.theme = dark ? 'dark' : 'light';
    if (st.currentCourse) h.dataset.course = st.currentCourse;
    if (s.scale) h.style.setProperty('--scale', s.scale);
  } catch (e) {}
})();
</script>

<div class="shell">

  <!-- 데스크톱: 그룹형 사이드바 -->
  <aside class="rail" aria-label="사이드바">
    <div class="rail-panel">
      <a class="rail-brand" href="#/" aria-label="千日文 홈">
        <span class="seal" aria-hidden="true">千</span>
        <span class="brand-text">
          <strong class="jp">日本語 千日文</strong>
          <small>핵심 문형 50과 · 1000문장</small>
        </span>
      </a>

      <button class="course-btn" type="button" data-action="open-course-menu" aria-haspopup="dialog" aria-label="학습 코스 선택">
        <span class="course-btn-copy">
          <small>학습 코스</small>
          <b><span data-bind="course-label">기초</span> <i data-bind="course-sub">N5–N3</i></b>
        </span>
        <span class="course-btn-pct" data-bind="course-pct">0%</span>
        <svg class="ic" aria-hidden="true"><use href="#i-chev-down"/></svg>
      </button>

      <nav class="rail-nav" aria-label="주요 메뉴">
        <a class="rail-link" href="#/" data-leaf="home" data-hub="home">
          <svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>홈</span>
        </a>

        <div class="rail-group" role="group" aria-labelledby="rg-learn">
          <span class="rail-label" id="rg-learn">학습</span>
          <a class="rail-link" href="#/chapters" data-leaf="learn-list" data-hub="learn">
            <svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>과별 학습</span>
          </a>
          <a class="rail-link" href="#/chapters?tab=grammar" data-leaf="learn-grammar" data-hub="learn">
            <svg class="ic" aria-hidden="true"><use href="#i-type"/></svg><span>문법 색인</span>
          </a>
          <a class="rail-link" href="#/all" data-leaf="learn-all" data-hub="learn">
            <svg class="ic" aria-hidden="true"><use href="#i-lines"/></svg><span>전체 문장</span>
          </a>
        </div>

        <div class="rail-group" role="group" aria-labelledby="rg-vocab">
          <span class="rail-label" id="rg-vocab">어휘</span>
          <a class="rail-link" href="#/words" data-leaf="vocab-words" data-hub="vocab">
            <svg class="ic" aria-hidden="true"><use href="#i-vocab"/></svg><span>단어장</span>
          </a>
          <a class="rail-link" href="#/kana" data-leaf="vocab-kana" data-hub="vocab">
            <span class="glyph jp" aria-hidden="true">あ</span><span>가나</span>
          </a>
        </div>

        <div class="rail-group" role="group" aria-labelledby="rg-practice">
          <span class="rail-label" id="rg-practice">연습</span>
          <a class="rail-link" href="#/quiz" data-leaf="practice-quiz" data-hub="practice">
            <svg class="ic" aria-hidden="true"><use href="#i-practice"/></svg><span>암기 카드</span>
          </a>
          <a class="rail-link" href="#/auto" data-leaf="practice-auto" data-hub="practice">
            <svg class="ic" aria-hidden="true"><use href="#i-headphones"/></svg><span>자동 듣기</span>
          </a>
          <a class="rail-link" href="#/review" data-leaf="practice-review" data-hub="practice">
            <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg><span>복습함</span>
          </a>
        </div>
      </nav>

      <div class="rail-foot">
        <div class="rail-status" data-bind="status" aria-label="오늘의 학습 현황"></div>
        <div class="rail-actions">
          <a class="rail-link" href="#/search" data-leaf="search" data-hub="search">
            <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>검색</span><kbd aria-hidden="true">/</kbd>
          </a>
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="다크 모드 전환" title="다크 모드 전환">
            <svg class="ic ico-moon" aria-hidden="true"><use href="#i-moon"/></svg>
            <svg class="ic ico-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          </button>
          <button class="icon-btn" type="button" data-action="open-settings" aria-haspopup="dialog" aria-label="설정" title="설정">
            <svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <div class="stage">
    <!-- 모바일·태블릿: 상단바 -->
    <header class="topbar">
      <a class="brand" href="#/" aria-label="千日文 홈">
        <span class="seal" aria-hidden="true">千</span>
        <span class="brand-text"><strong class="jp">日本語 千日文</strong></span>
      </a>
      <div class="topbar-actions">
        <button class="course-chip" type="button" data-action="open-course-menu" aria-haspopup="dialog" aria-label="학습 코스 선택" title="학습 코스 선택">
          <span data-bind="course-label">코스</span>
          <svg class="ic" aria-hidden="true"><use href="#i-chev-down"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="다크 모드 전환" title="다크 모드 전환">
          <svg class="ic ico-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="ic ico-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <button class="icon-btn" type="button" data-action="open-settings" aria-haspopup="dialog" aria-label="설정" title="설정">
          <svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>
  </div>
</div>

<!-- 모바일·태블릿: 플로팅 독 (5개 허브) -->
<nav class="dock" aria-label="하단 메뉴" style="--i:0">
  <i class="dock-thumb" aria-hidden="true"></i>
  <a href="#/" data-hub="home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>홈</span></a>

  <a href="#/words" data-hub="vocab"><svg class="ic" aria-hidden="true"><use href="#i-vocab"/></svg><span>어휘</span></a>
  <a href="#/quiz" data-hub="practice"><svg class="ic" aria-hidden="true"><use href="#i-practice"/></svg><span>연습</span></a>

</nav>

<button id="to-top" class="to-top" type="button" data-action="to-top" aria-label="맨 위로">
  <svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg>
</button>

<!-- 설정·코스 선택 시트 / 확인 다이얼로그 (네이티브 <dialog>: 포커스 트랩·Esc 지원) -->
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-action="close-sheet" aria-label="닫기">
        <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>

<dialog id="confirm" class="sheet sheet-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
  <div class="sheet-panel">
    <h2 id="confirm-title"></h2>
    <p id="confirm-desc"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" type="button" data-action="confirm-no">취소</button>
      <button class="btn btn-primary" type="button" data-action="confirm-yes" id="confirm-yes">확인</button>
    </div>
  </div>
</dialog>

<div id="toast-root" aria-live="polite"></div>
<div id="route-announcer" class="sr-only" aria-live="polite" role="status"></div>
